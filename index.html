<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Opaque, not black-translucent: on iOS/iPadOS 26 a translucent status bar makes the
         home-screen app one status bar short (a strip at the bottom) and blurs the top. iOS reads
         this when the app is added to the home screen, so re-add it after changing this. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Safari tints its top bar with this; match the sky so the top edge blends in. -->
    <meta name="theme-color" content="#7fb6e6" />
    <title>Ridgeline</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Ridgeline" />
    <style>
      /* Sizing: iOS Safari's "100%" page height is measured with its toolbars showing, so it
         can stop short of the real screen and leave a strip at the bottom. Everything full-screen
         is sized from --app-h instead, which src/ui/viewport.ts keeps equal to the visible height
         (window.innerHeight). The ground-coloured page background is only a fallback. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html { margin: 0; height: 100%; overflow: hidden; background-color: #6b4a2f; }
      body { margin: 0; height: var(--app-h, 100dvh); overflow: hidden; background: transparent; }
      .full { position: fixed; top: 0; left: 0; width: 100%; height: var(--app-h, 100dvh); }
      body {
        position: fixed; top: 0; left: 0; width: 100%;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        font: 14px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #fff;
      }
      #game {
        display: block; position: fixed; z-index: 0;
        top: 0; left: 0;
        width: 100%; height: var(--app-h, 100dvh);
      }
      #endRun {
        position: fixed; z-index: 5;
        top: max(12px, var(--safe-top)); right: max(12px, var(--safe-right));
        padding: 10px 16px; border: 0; border-radius: 12px;
        background: rgba(16, 21, 28, 0.35); color: #fff; font: 600 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
      }
      .hidden { display: none !important; }
      .screen {
        position: fixed; top: 0; left: 0; width: 100%; height: var(--app-h, 100dvh); z-index: 6; overflow-y: auto;
        padding: max(16px, var(--safe-top)) max(16px, var(--safe-right)) max(16px, var(--safe-bottom)) max(16px, var(--safe-left));
        box-sizing: border-box; background: linear-gradient(160deg, rgba(18, 32, 58, 0.92), rgba(30, 22, 52, 0.9));
        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        /* Centred when everything fits; "safe" falls back to the top when it would overflow. */
        justify-content: safe center;
        touch-action: manipulation;
      }
      .screen h1 { margin: 0; font-size: 26px; }
      .screen h2 { margin: 0; font-size: 22px; }
      .bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .coins { font-size: 22px; font-weight: 800; color: #ffd23f; margin-left: auto; }
      .cards { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .card { background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06)); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
      .card .name { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; }
      .card .name svg { width: 22px; height: 22px; flex: none; }
      .card.bought { animation: bought 0.6s ease-out; }
      @keyframes bought {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(63, 191, 95, 0.9); }
        35% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(63, 191, 95, 0.5); }
        100% { transform: scale(1); box-shadow: 0 0 0 14px rgba(63, 191, 95, 0); }
      }
      .pips i.new { animation: pip 0.6s ease-out; }
      @keyframes pip { 0% { background: #ffffff; transform: scaleY(1.8); } 100% { background: #3fbf5f; transform: scaleY(1); } }
      .screen h1, .screen h2 { letter-spacing: 0.3px; }
      .results-total { font-size: 34px; font-weight: 900; color: #ffd23f; text-shadow: 0 2px 0 #7a5200; }
      .card .blurb { font-size: 12px; opacity: 0.8; min-height: 30px; }
      .pips { display: flex; gap: 3px; }
      .pips i { flex: 1; height: 8px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); }
      .pips i.on { background: #3fbf5f; }
      button.buy, button.big, button.small {
        border: 0; border-radius: 12px; font: 700 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #fff;
        padding: 10px 12px; background: #2f80ed;
      }
      button.buy:disabled { background: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.5); }
      button.big { font-size: 22px; padding: 14px 40px; background: linear-gradient(180deg, #5fd97c, #2fa64f); box-shadow: 0 4px 0 #1f7a38; }
      button.big.blue { background: linear-gradient(180deg, #4c97f5, #2468d1); box-shadow: 0 4px 0 #17479a; }
      button.buy:not(:disabled) { background: linear-gradient(180deg, #4c97f5, #2468d1); box-shadow: 0 3px 0 #17479a; }
      button:active { transform: translateY(2px); }
      button.small { font-size: 13px; padding: 8px 12px; background: rgba(255, 255, 255, 0.15); }
      .rows { width: 100%; max-width: 360px; font-size: 16px; }
      .rows div { display: flex; justify-content: space-between; padding: 3px 0; }
      .rows .total { border-top: 1px solid rgba(255, 255, 255, 0.3); margin-top: 4px; padding-top: 6px; font-weight: 800; color: #ffd23f; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .best { font-size: 14px; opacity: 0.85; }
      .label { width: 100%; max-width: 900px; font-size: 13px; font-weight: 700; opacity: 0.75; margin-bottom: -6px; }
      .choices { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      button.choice {
        border: 2px solid transparent; border-radius: 14px; padding: 8px 10px; text-align: left; color: #fff;
        background: rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 2px;
        font: 13px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
      }
      button.choice .name { font-weight: 800; font-size: 15px; }
      canvas.thumb { width: 100%; height: 46px; border-radius: 10px; margin-bottom: 4px; display: block; }
      canvas.thumb.vehicle { background: radial-gradient(ellipse at 50% 90%, rgba(255,255,255,0.18), rgba(255,255,255,0) 70%); }
      button.choice.locked canvas.thumb { filter: grayscale(0.7) brightness(0.7); }
      @media (min-height: 600px) { canvas.thumb { height: 72px; } }
      button.choice .blurb { opacity: 0.8; font-size: 12px; }
      button.choice .price { color: #ffd23f; font-weight: 800; }
      button.choice.on { border-color: #3fbf5f; background: rgba(63, 191, 95, 0.18); }
      button.choice.locked { background: rgba(0, 0, 0, 0.25); }
      button.choice:disabled { opacity: 0.55; }
      .coin { color: #ffd23f; }
      .badge { font-size: 11px; vertical-align: middle; padding: 3px 7px; border-radius: 6px; background: #e5383b; letter-spacing: 0.5px; }
      .newbest { color: #3fbf5f; font-weight: 800; }
      /* Players: tick who plays the round. Each has a colour for their name and ghost. */
      .players { display: flex; gap: 6px; flex-wrap: wrap; }
      button.player {
        border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 999px; padding: 6px 12px 6px 6px; color: #fff;
        background: rgba(255, 255, 255, 0.08); display: inline-flex; align-items: center; gap: 6px;
        font: 800 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
      }
      button.player .tick {
        width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--c); display: inline-grid; place-items: center;
        font-size: 13px; line-height: 1;
      }
      button.player.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 28%, transparent); }
      button.player.on .tick { background: var(--c); }
      button.big:disabled { opacity: 0.45; }
      .who { font-size: 18px; font-weight: 900; color: var(--c); }
      .pname { color: var(--c); }
      .who.big-who { font-size: clamp(34px, 9vh, 64px); margin: 6px 0 2px; text-shadow: 0 3px 0 rgba(0,0,0,0.35); animation: whoPop 0.5s cubic-bezier(.2,1.6,.4,1); }
      @keyframes whoPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .order { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin: 6px 0 4px; }
      .order .arrow { opacity: 0.6; font-weight: 800; }
      .pchip { border: 2px solid color-mix(in srgb, var(--c) 60%, transparent); border-radius: 999px; padding: 4px 12px; font-weight: 800; opacity: 0.75; }
      .pchip b { color: var(--c); margin-right: 2px; }
      .pchip.done { opacity: 0.5; }
      .turn-vehicles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 8px 0 2px; }
      button.tveh { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 10px 6px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.15); background: rgba(16,21,28,0.45); color: #fff; font-weight: 800; font-size: 15px; min-width: 110px; }
      button.tveh canvas { width: 96px; height: 44px; }
      button.tveh.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 30%, rgba(16,21,28,0.45)); }
      .rows.standings .veh { opacity: 0.7; font-weight: 600; margin-left: 4px; }
      .pchip.on { opacity: 1; border-color: var(--c); background: color-mix(in srgb, var(--c) 30%, transparent); }
      .rows.scores, .rows.standings { max-width: 460px; font-size: 17px; }
      .rows.scores div { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: 8px; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }
      .rows.scores .rank { opacity: 0.7; font-weight: 800; }
      .rows.scores .veh { opacity: 0.8; }
      .rows.scores .dist, .rows.standings span:last-child { font-weight: 800; }
      .rows.scores .empty { display: block; opacity: 0.7; text-align: center; border: 0; }
      .rows.standings div { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }
      .players { flex-wrap: nowrap; }
      .sync { align-items: center; gap: 10px; }
      .sync .code { font-size: 15px; letter-spacing: 1px; color: #ffd23f; }
      .sync .join { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
      .sync input { width: 150px; padding: 8px; border-radius: 10px; border: 0; font: 700 15px ui-monospace, monospace; text-transform: uppercase; }
      .sync .err { color: #ff8a8a; width: 100%; text-align: right; }
      /* Maps in rows of three (six maps: two even rows). */
      .choices.envs, .choices.vehicles { grid-template-columns: repeat(3, 1fr); }
      .choices.daily { grid-template-columns: repeat(2, 1fr); }
      .daily-label { color: #ffd23f; font-weight: 800; }
      button.choice .note { color: #ffd23f; font-weight: 800; font-size: 12px; }
      .modebar { width: 100%; max-width: 900px; display: flex; align-items: center; gap: 10px; margin-bottom: -4px; }
      .modebar .label { width: auto; margin: 0; }
      .racetime { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
      .coins { white-space: nowrap; }
      /* Narrow phones: the players and Drive matter more than the title. */
      @media (max-width: 700px) { .bar h1 { display: none; } }
      .bests { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 14px; opacity: 0.9; }
      #tune { gap: 8px; align-items: stretch; }
      #tune .sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 16px; width: 100%; }
      #tune label { display: grid; grid-template-columns: 1fr 60px; gap: 2px 8px; font-size: 13px; }
      #tune input[type=range] { grid-column: 1 / -1; width: 100%; }
      #tune textarea { width: 100%; height: 120px; font: 11px ui-monospace, monospace; }
      .seg { display: inline-flex; flex-wrap: wrap; justify-content: center; border-radius: 10px; overflow: hidden; }
      .seg button { border: 0; padding: 8px 12px; font: 700 13px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; background: rgba(255, 255, 255, 0.12); color: #fff; }
      .seg button.on { background: #2f80ed; }
      /* Landscape phones (every iPhone is under 500 points tall in landscape; the smallest iPad
         is 744): keep vehicles and upgrade buttons on screen without scrolling. */
      @media (max-height: 500px) {
        .screen { gap: 6px; padding-top: max(10px, var(--safe-top)); padding-bottom: max(10px, var(--safe-bottom)); }
        .screen h1 { font-size: 21px; }
        .coins { font-size: 18px; }
        button.big { font-size: 17px; padding: 8px 26px; }
        .bar button.big { padding: 7px 24px; }
        .label { font-size: 11px; margin-bottom: -3px; }
        button.player { font-size: 13px; padding: 3px 9px 3px 3px; gap: 4px; }
        button.player .tick { width: 16px; height: 16px; font-size: 11px; }
        .cards, .choices { gap: 6px; }
        .card { padding: 6px 8px; gap: 3px; }
        .card .name { font-size: 14px; }
        .card .blurb, button.choice .blurb { display: none; }
        .pips i { height: 6px; }
        button.buy { padding: 7px 6px; font-size: 13px; }
        button.choice { padding: 5px 8px; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 2px 8px; }
        button.choice .name { font-size: 13px; }
        button.choice .price { font-size: 12px; }
        canvas.thumb { height: 30px; width: 64px; margin: 0; }
      }
      #rotate {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: var(--app-h, 100dvh); z-index: 10;
        background: #1b2330; align-items: center; justify-content: center;
        font-size: 20px; text-align: center; padding: 24px; box-sizing: border-box;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      /* The rotate prompt is for the menus only; a run in progress is never covered by it. */
      body.playing #rotate { display: none !important; }
      #pauseBtn {
        position: fixed; z-index: 5; top: max(12px, var(--safe-top)); right: calc(max(12px, var(--safe-right)) + 108px);
        width: 44px; height: 40px; border: 0; border-radius: 12px; background: rgba(16, 21, 28, 0.35); color: #fff; font: 800 15px ui-rounded, system-ui, sans-serif;
      }
      #horn {
        position: fixed; z-index: 5; bottom: max(24px, calc(var(--safe-bottom) + 8px)); left: 50%; transform: translateX(-50%);
        width: 64px; height: 44px; border: 0; border-radius: 22px; background: rgba(16, 21, 28, 0.35); color: #ffd23f;
        font: 900 15px ui-rounded, system-ui, sans-serif; touch-action: manipulation;
      }
      #boost {
        position: fixed; z-index: 5; bottom: calc(max(24px, var(--safe-bottom)) + 170px); right: max(24px, var(--safe-right));
        width: 120px; height: 56px; border: 0; border-radius: 16px; background: rgba(255, 120, 40, 0.45); color: #fff;
        font: 900 17px ui-rounded, system-ui, sans-serif; touch-action: none;
      }
      #boost.on { background: rgba(255, 150, 60, 0.85); }
      body.swapped #boost { right: auto; left: max(24px, var(--safe-left)); }
      #horn:active { background: rgba(255, 210, 63, 0.4); }
      #paused h2 { font-size: 34px; margin: 0; }
      #update {
        position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: max(12px, var(--safe-bottom));
        padding: 10px 18px; border: 0; border-radius: 999px; background: #3fbf5f; color: #fff; font: 800 15px ui-rounded, system-ui, sans-serif;
        box-shadow: 0 4px 0 #2a8a43;
      }
      button.small.go { background: #3fbf5f; box-shadow: 0 3px 0 #2a8a43; }
      button.small.go:disabled { opacity: 0.45; }
      .cup-table { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; font-weight: 800; font-size: 16px; }
      .cup-table .lead { color: #ffd23f; }
      .trophy { font-size: 64px; line-height: 1; animation: whoPop 0.6s cubic-bezier(.2,1.6,.4,1); }
      .missions { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 6px; }
      .mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
      .mrow .pname { min-width: 56px; }
      .mission { background: rgba(255,255,255,0.08); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
      .missions-done { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7dff8a; font-weight: 800; }
      canvas.pip { width: 180px; height: 150px; }
      .choices.outfit { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
      .family { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
      .family .week { color: #ffd23f; }
      .ftable { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-size: 14px; }
      .partrow { width: 100%; max-width: 900px; display: flex; flex-wrap: wrap; gap: 6px; }
      button.part { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 10px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #fff; font-size: 13px; text-align: left; }
      button.part small { opacity: 0.7; font-size: 11px; }
      button.part .price { color: #ffd23f; font-weight: 800; font-size: 12px; }
      button.part.on { border-color: #3fbf5f; background: rgba(63, 191, 95, 0.18); }
      button.part:disabled { opacity: 0.5; }
      #replayBar { position: fixed; z-index: 7; top: max(12px, var(--safe-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
        background: rgba(16, 21, 28, 0.55); padding: 6px 8px 6px 16px; border-radius: 999px; font-weight: 800; }
      .bests button.play { margin-left: 6px; padding: 2px 8px; border-radius: 999px; border: 0; background: #3fbf5f; color: #fff; font-weight: 900; }
      .screeninfo { font-size: 11px; opacity: 0.5; max-width: 600px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="pauseBtn" class="hidden" aria-label="Paus">❚❚</button>
    <button id="endRun" class="hidden">Avsluta</button>
    <button id="horn" class="hidden" aria-label="Tuta">TUT</button>
    <button id="boost" class="hidden" aria-label="Raketer">BOOST</button>
    <div id="paused" class="screen hidden"><h2>Paus</h2><div class="actions"><button class="big blue" data-act="end">Avsluta åket</button><button class="big" data-act="resume">Fortsätt</button></div></div>
    <div id="replayBar" class="hidden"><span></span><button class="small" data-act="back">Tillbaka</button></div>
    <button id="update" class="hidden">Ny version finns · tryck för att uppdatera</button>
    <div id="garage" class="screen hidden"></div>
    <div id="results" class="screen hidden"></div>
    <div id="scores" class="screen hidden"></div>
    <div id="tune" class="screen hidden"></div>
    <div id="settings" class="screen hidden"></div>
    <div id="rotate">Vrid enheten till liggande läge</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
