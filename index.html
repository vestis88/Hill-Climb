<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ridgeline</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2330; }
      body {
        position: fixed; inset: 0;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        font: 14px -apple-system, system-ui, sans-serif; color: #fff;
      }
      canvas { display: block; width: 100%; height: 100%; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #1b2330; align-items: center; justify-content: center;
        font-size: 20px; text-align: center; padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="rotate">Rotate your device to landscape</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
