<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Safari tints its top bar with this; match the sky so the top edge blends in. -->
    <meta name="theme-color" content="#7fb6e6" />
    <title>Ridgeline</title>
    <style>
      /* Safari on iPad can leave a strip of page background visible under its toolbars.
         Sky colour at the top and ground colour at the bottom make any strip blend in. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#7fb6e6 50%, #6b4a2f 50%); }
      body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      body {
        position: fixed; inset: 0;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        font: 14px -apple-system, system-ui, sans-serif; color: #fff;
      }
      canvas { display: block; width: 100%; height: 100%; }
      #restart {
        position: fixed; z-index: 5;
        top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
        padding: 10px 16px; border: 0; border-radius: 12px;
        background: rgba(16, 21, 28, 0.35); color: #fff; font: 600 15px -apple-system, system-ui, sans-serif;
      }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #1b2330; align-items: center; justify-content: center;
        font-size: 20px; text-align: center; padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="restart">Restart</button>
    <div id="rotate">Rotate your device to landscape</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
