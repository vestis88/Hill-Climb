<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Opaque, not black-translucent: on iOS/iPadOS 26 a translucent status bar makes the
         home-screen app one status bar short (a strip at the bottom) and blurs the top. iOS reads
         this when the app is added to the home screen, so re-add it after changing this. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Safari tints its top bar with this; match the sky so the top edge blends in. -->
    <meta name="theme-color" content="#7fb6e6" />
    <title>Ridgeline</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Ridgeline" />
    <style>
      /* Sizing: iOS Safari's "100%" page height is measured with its toolbars showing, so it
         can stop short of the real screen and leave a strip at the bottom. Everything full-screen
         is sized from --app-h instead, which src/ui/viewport.ts keeps equal to the visible height
         (window.innerHeight). The ground-coloured page background is only a fallback. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html { margin: 0; height: 100%; overflow: hidden; background-color: #6b4a2f; }
      body { margin: 0; height: var(--app-h, 100dvh); overflow: hidden; background: transparent; }
      .full { position: fixed; top: 0; left: 0; width: 100%; height: var(--app-h, 100dvh); }
      body {
        position: fixed; top: 0; left: 0; width: 100%;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        font: 14px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #fff;
      }
      #game {
        display: block; position: fixed; z-index: 0;
        top: 0; left: 0;
        width: 100%; height: var(--app-h, 100dvh);
      }
      /* Duel: two players at once. Side by side (landscape): player 1 left, player 2 right, for
         sitting next to each other. Opposite (portrait): player 2 at the bottom and player 1 at
         the top turned upside down, for sitting either side of the iPad. */
      #game2 { display: block; position: fixed; z-index: 0; }
      body.duel.beside #game { width: 50%; height: var(--app-h, 100dvh); border-right: 3px solid #1d2433; box-sizing: border-box; }
      body.duel.beside #game2 { top: 0; left: 50%; width: 50%; height: var(--app-h, 100dvh); }
      body.duel.opposite #game { height: calc(var(--app-h, 100dvh) / 2); transform: rotate(180deg); border-top: 3px solid #1d2433; box-sizing: border-box; }
      body.duel.opposite #game2 { top: calc(var(--app-h, 100dvh) / 2); left: 0; width: 100%; height: calc(var(--app-h, 100dvh) / 2); }
      #duelLayout {
        position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: max(12px, var(--safe-top));
        border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(16, 21, 28, 0.6); color: #fff;
        font: 800 14px ui-rounded, system-ui, sans-serif;
      }
      body.duel.opposite #duelLayout { top: calc(var(--app-h, 100dvh) / 2 - 18px); }
      #paused .duel-only { display: none; }
      body.duel #paused .duel-only { display: inline-block; }
      #endRun {
        position: fixed; z-index: 5;
        top: max(12px, var(--safe-top)); right: max(12px, var(--safe-right));
        padding: 10px 16px; border: 0; border-radius: 12px;
        background: rgba(16, 21, 28, 0.35); color: #fff; font: 600 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
      }
      .hidden { display: none !important; }
      .screen {
        position: fixed; top: 0; left: 0; width: 100%; height: var(--app-h, 100dvh); z-index: 6; overflow-y: auto;
        padding: max(16px, var(--safe-top)) max(16px, var(--safe-right)) max(16px, var(--safe-bottom)) max(16px, var(--safe-left));
        box-sizing: border-box; background: linear-gradient(160deg, rgba(18, 32, 58, 0.92), rgba(30, 22, 52, 0.9));
        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        /* Centred when everything fits; "safe" falls back to the top when it would overflow. */
        justify-content: safe center;
        touch-action: manipulation;
      }
      /* WebKit leaves a scrolling flex column's bottom padding out of what can be scrolled to, so
         the last row ends flush against the screen edge (owner's iPad). A real spacer instead. */
      .screen { padding-bottom: 0; }
      .screen::after { content: ''; display: block; flex: none; width: 1px; height: calc(max(16px, var(--safe-bottom)) + 8px); margin-top: -4px; }
      .screen h1 { margin: 0; font-size: 26px; }
      .screen h2 { margin: 0; font-size: 22px; }
      .bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .coins { font-size: 22px; font-weight: 800; color: #ffd23f; margin-left: auto; }
      .cards { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .card { background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06)); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
      .card .name { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; }
      .card .name svg { width: 22px; height: 22px; flex: none; }
      .card.bought { animation: bought 0.6s ease-out; }
      @keyframes bought {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(63, 191, 95, 0.9); }
        35% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(63, 191, 95, 0.5); }
        100% { transform: scale(1); box-shadow: 0 0 0 14px rgba(63, 191, 95, 0); }
      }
      .pips i.new { animation: pip 0.6s ease-out; }
      @keyframes pip { 0% { background: #ffffff; transform: scaleY(1.8); } 100% { background: #3fbf5f; transform: scaleY(1); } }
      .screen h1, .screen h2 { letter-spacing: 0.3px; }
      .results-total { font-size: 34px; font-weight: 900; color: #ffd23f; text-shadow: 0 2px 0 #7a5200; }
      .card .blurb { font-size: 12px; opacity: 0.8; min-height: 30px; }
      .pips { display: flex; gap: 3px; }
      .pips i { flex: 1; height: 8px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); }
      .pips i.on { background: #3fbf5f; }
      button.buy, button.big, button.small {
        border: 0; border-radius: 12px; font: 700 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #fff;
        padding: 10px 12px; background: #2f80ed;
      }
      button.buy:disabled { background: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.5); }
      button.big { font-size: 22px; padding: 14px 40px; background: linear-gradient(180deg, #5fd97c, #2fa64f); box-shadow: 0 4px 0 #1f7a38; }
      button.big.blue { background: linear-gradient(180deg, #4c97f5, #2468d1); box-shadow: 0 4px 0 #17479a; }
      button.buy:not(:disabled) { background: linear-gradient(180deg, #4c97f5, #2468d1); box-shadow: 0 3px 0 #17479a; }
      button:active { transform: translateY(2px); }
      button.small { font-size: 13px; padding: 8px 12px; background: rgba(255, 255, 255, 0.15); }
      .rows { width: 100%; max-width: 360px; font-size: 16px; }
      .rows div { display: flex; justify-content: space-between; padding: 3px 0; }
      .rows .total { border-top: 1px solid rgba(255, 255, 255, 0.3); margin-top: 4px; padding-top: 6px; font-weight: 800; color: #ffd23f; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .best { font-size: 14px; opacity: 0.85; }
      .label { width: 100%; max-width: 900px; font-size: 13px; font-weight: 700; opacity: 0.75; margin-bottom: -6px; }
      .choices { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      button.choice {
        border: 2px solid transparent; border-radius: 14px; padding: 8px 10px; text-align: left; color: #fff;
        background: rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 2px;
        font: 13px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
      }
      button.choice .name { font-weight: 800; font-size: 15px; }
      canvas.thumb { width: 100%; height: 46px; border-radius: 10px; margin-bottom: 4px; display: block; }
      canvas.thumb.vehicle { background: radial-gradient(ellipse at 50% 90%, rgba(255,255,255,0.18), rgba(255,255,255,0) 70%); }
      button.choice.locked canvas.thumb { filter: grayscale(0.7) brightness(0.7); }
      @media (min-height: 600px) { canvas.thumb { height: 72px; } }
      button.choice .blurb { opacity: 0.8; font-size: 12px; }
      button.choice .price { color: #ffd23f; font-weight: 800; }
      button.choice.on { border-color: #3fbf5f; background: rgba(63, 191, 95, 0.18); }
      button.choice.locked { background: rgba(0, 0, 0, 0.25); }
      button.choice:disabled { opacity: 0.55; }
      .coin { color: #ffd23f; }
      .badge { font-size: 11px; vertical-align: middle; padding: 3px 7px; border-radius: 6px; background: #e5383b; letter-spacing: 0.5px; }
      .newbest { color: #3fbf5f; font-weight: 800; }
      /* Players: tick who plays the round. Each has a colour for their name and ghost. */
      .players { display: flex; gap: 6px; flex-wrap: wrap; }
      button.player {
        border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 999px; padding: 6px 12px 6px 6px; color: #fff;
        background: rgba(255, 255, 255, 0.08); display: inline-flex; align-items: center; gap: 6px;
        font: 800 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
      }
      button.player .tick {
        width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--c); display: inline-grid; place-items: center;
        font-size: 13px; line-height: 1;
      }
      button.player.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 28%, transparent); }
      button.player.on .tick { background: var(--c); }
      button.big:disabled { opacity: 0.45; }
      .who { font-size: 18px; font-weight: 900; color: var(--c); }
      .pname { color: var(--c); }
      .who.big-who { font-size: clamp(34px, 9vh, 64px); margin: 6px 0 2px; text-shadow: 0 3px 0 rgba(0,0,0,0.35); animation: whoPop 0.5s cubic-bezier(.2,1.6,.4,1); }
      @keyframes whoPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .order { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin: 6px 0 4px; }
      .order .arrow { opacity: 0.6; font-weight: 800; }
      .pchip { border: 2px solid color-mix(in srgb, var(--c) 60%, transparent); border-radius: 999px; padding: 4px 12px; font-weight: 800; opacity: 0.75; }
      .pchip b { color: var(--c); margin-right: 2px; }
      .pchip.done { opacity: 0.5; }
      .turn-vehicles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 8px 0 2px; }
      button.tveh { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 10px 6px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.15); background: rgba(16,21,28,0.45); color: #fff; font-weight: 800; font-size: 15px; min-width: 110px; }
      button.tveh canvas { width: 96px; height: 44px; }
      button.tveh.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 30%, rgba(16,21,28,0.45)); }
      .rows.standings .veh { opacity: 0.7; font-weight: 600; margin-left: 4px; }
      .pchip.on { opacity: 1; border-color: var(--c); background: color-mix(in srgb, var(--c) 30%, transparent); }
      .rows.scores, .rows.standings { max-width: 460px; font-size: 17px; }
      .rows.scores div { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: 8px; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }
      .rows.scores .rank { opacity: 0.7; font-weight: 800; }
      .rows.scores .veh { opacity: 0.8; }
      .rows.scores .dist, .rows.standings span:last-child { font-weight: 800; }
      .rows.scores .empty { display: block; opacity: 0.7; text-align: center; border: 0; }
      .rows.standings div { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }
      .players { flex-wrap: nowrap; }
      .sync { align-items: center; gap: 10px; }
      .sync .code { font-size: 15px; letter-spacing: 1px; color: #ffd23f; }
      .sync .join { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
      .sync input { width: 150px; padding: 8px; border-radius: 10px; border: 0; font: 700 15px ui-monospace, monospace; text-transform: uppercase; }
      .sync .err { color: #ff8a8a; width: 100%; text-align: right; }
      .sync input[data-act="devname"] { width: 140px; padding: 4px 8px; font: 600 14px system-ui, sans-serif; text-transform: none; margin-top: 4px; }
      .backups { display: flex; flex-direction: column; gap: 6px; padding: 0 0 8px; }
      .backup { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: rgba(255,255,255,.07); border-radius: 12px; padding: 8px 12px; }
      .backup.mine { outline: 1px solid rgba(255,210,63,.5); }
      .backup small { opacity: .75; }
      /* Maps in rows of three (six maps: two even rows). */
      .choices.envs, .choices.vehicles { grid-template-columns: repeat(3, 1fr); }
      .choices.daily { grid-template-columns: repeat(2, 1fr); }
      .daily-label { color: #ffd23f; font-weight: 800; }
      button.choice .note { color: #ffd23f; font-weight: 800; font-size: 12px; }
      .modebar { width: 100%; max-width: 900px; display: flex; align-items: center; gap: 10px; margin-bottom: -4px; }
      .modebar .label { width: auto; margin: 0; }
      .racetime { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
      .coins { white-space: nowrap; }
      /* Narrow phones: the players and Drive matter more than the title. */
      @media (max-width: 700px) { .bar h1 { display: none; } }
      .bests { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 14px; opacity: 0.9; }
      .seg { display: inline-flex; flex-wrap: wrap; justify-content: center; border-radius: 10px; overflow: hidden; }
      .seg button { border: 0; padding: 8px 12px; font: 700 13px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; background: rgba(255, 255, 255, 0.12); color: #fff; }
      .seg button.on { background: #2f80ed; }
      /* Landscape phones (every iPhone is under 500 points tall in landscape; the smallest iPad
         is 744): keep vehicles and upgrade buttons on screen without scrolling. */
      @media (max-height: 500px) {
        .screen { gap: 6px; padding-top: max(10px, var(--safe-top)); padding-bottom: max(10px, var(--safe-bottom)); }
        .screen h1 { font-size: 21px; }
        .coins { font-size: 18px; }
        button.big { font-size: 17px; padding: 8px 26px; }
        .bar button.big { padding: 7px 24px; }
        .label { font-size: 11px; margin-bottom: -3px; }
        button.player { font-size: 13px; padding: 3px 9px 3px 3px; gap: 4px; }
        button.player .tick { width: 16px; height: 16px; font-size: 11px; }
        .cards, .choices { gap: 6px; }
        .card { padding: 6px 8px; gap: 3px; }
        .card .name { font-size: 14px; }
        .card .blurb, button.choice .blurb { display: none; }
        .pips i { height: 6px; }
        button.buy { padding: 7px 6px; font-size: 13px; }
        button.choice { padding: 5px 8px; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 2px 8px; }
        button.choice .name { font-size: 13px; }
        button.choice .price { font-size: 12px; }
        canvas.thumb { height: 30px; width: 64px; margin: 0; }
      }
      /* Driving with the device turned to portrait: the page is turned back to landscape
         (ui/landscape.ts), so the game stays put relative to the device. */
      body.turned { position: fixed; top: 0; left: 0; width: var(--turn-w); height: var(--turn-h); overflow: hidden; transform-origin: 0 0; }
      body.turn-cw { transform: translateX(var(--turn-h)) rotate(90deg); }
      body.turn-ccw { transform: translateY(var(--turn-w)) rotate(-90deg); }
      #rotate {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: var(--app-h, 100dvh); z-index: 10;
        background: #1b2330; align-items: center; justify-content: center;
        font-size: 20px; text-align: center; padding: 24px; box-sizing: border-box;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      /* The rotate prompt is for the menus only; a run in progress is never covered by it. */
      body.playing #rotate { display: none !important; }
      #pauseBtn {
        position: fixed; z-index: 5; top: max(12px, var(--safe-top)); right: calc(max(12px, var(--safe-right)) + 108px);
        width: 44px; height: 40px; border: 0; border-radius: 12px; background: rgba(16, 21, 28, 0.35); color: #fff; font: 800 15px ui-rounded, system-ui, sans-serif;
      }
      /* Klurbanor: start the level again at once (Elma style). */
      #restart {
        position: fixed; z-index: 5; top: max(12px, var(--safe-top)); right: calc(max(12px, var(--safe-right)) + 160px);
        width: 44px; height: 40px; border: 0; border-radius: 12px; background: rgba(180, 76, 255, 0.55); color: #fff; font: 900 20px ui-rounded, system-ui, sans-serif;
      }
      #horn {
        position: fixed; z-index: 5; bottom: max(24px, calc(var(--safe-bottom) + 8px)); left: 50%; transform: translateX(-50%);
        width: 64px; height: 44px; border: 0; border-radius: 22px; background: rgba(16, 21, 28, 0.35); color: #ffd23f;
        font: 900 15px ui-rounded, system-ui, sans-serif; touch-action: manipulation;
      }
      #boost {
        position: fixed; z-index: 5; bottom: calc(max(24px, var(--safe-bottom)) + 170px); right: max(24px, var(--safe-right));
        width: 120px; height: 56px; border: 0; border-radius: 16px; background: rgba(255, 120, 40, 0.45); color: #fff;
        font: 900 17px ui-rounded, system-ui, sans-serif; touch-action: none;
      }
      #boost.on { background: rgba(255, 150, 60, 0.85); }
      body.swapped #boost { right: auto; left: max(24px, var(--safe-left)); }
      #horn:active { background: rgba(255, 210, 63, 0.4); }
      #paused h2 { font-size: 34px; margin: 0; }
      #update {
        position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: max(12px, var(--safe-bottom));
        padding: 10px 18px; border: 0; border-radius: 999px; background: #3fbf5f; color: #fff; font: 800 15px ui-rounded, system-ui, sans-serif;
        box-shadow: 0 4px 0 #2a8a43;
      }
      button.small.go { background: #3fbf5f; box-shadow: 0 3px 0 #2a8a43; }
      button.small.go:disabled { opacity: 0.45; }
      .cup-table { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; font-weight: 800; font-size: 16px; }
      .cup-table .lead { color: #ffd23f; }
      .trophy { font-size: 64px; line-height: 1; animation: whoPop 0.6s cubic-bezier(.2,1.6,.4,1); }
      .missions { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 6px; }
      .mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
      .mrow .pname { min-width: 56px; }
      .mission { background: rgba(255,255,255,0.08); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
      /* Results: stacked when narrow; side by side when wide (a phone held sideways), so the buttons stay on screen. */
      .res { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 860px; }
      .res-main { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
      @media (min-aspect-ratio: 4/3) {
        .res { flex-direction: row; align-items: center; justify-content: center; gap: 36px; }
        .res-main { flex: 1 1 0; max-width: 440px; }
        .res .rows { flex: 1 1 0; max-width: 340px; background: rgba(255,255,255,0.06); border-radius: 14px; padding: 10px 14px; }
      }
      @media (max-height: 500px) {
        .res .results-total { font-size: 28px; }
        .res .rows { font-size: 15px; }
        .res .rows div { padding: 2px 0; }
        .res .missions-done { font-size: 13px; }
        .res button.big { font-size: 19px; padding: 11px 28px; }
      }
      .missions-done { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7dff8a; font-weight: 800; }
      canvas.pip { width: 180px; height: 150px; }
      .swatches { width: 100%; max-width: 900px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      button.swatch { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.25); background: var(--c); color: #fff; font: 900 18px ui-rounded, system-ui, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,0.6); padding: 0; }
      button.swatch.on { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.35); }
      button.swatch:disabled { opacity: 0.35; }
      button.swatch small { font-size: 9px; font-weight: 800; }
      .choices.outfit { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
      .family { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
      .family .week { color: #ffd23f; }
      .ftable { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-size: 14px; }
      .partrow { width: 100%; max-width: 900px; display: flex; flex-wrap: wrap; gap: 6px; }
      button.part { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 10px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #fff; font-size: 13px; text-align: left; }
      button.part small { opacity: 0.7; font-size: 11px; }
      button.part .price { color: #ffd23f; font-weight: 800; font-size: 12px; }
      button.part.on { border-color: #3fbf5f; background: rgba(63, 191, 95, 0.18); }
      button.part:disabled { opacity: 0.5; }
      #replayBar { position: fixed; z-index: 7; top: max(12px, var(--safe-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
        background: rgba(16, 21, 28, 0.55); padding: 6px 8px 6px 16px; border-radius: 999px; font-weight: 800; }
      .bests button.play { margin-left: 6px; padding: 2px 8px; border-radius: 999px; border: 0; background: #3fbf5f; color: #fff; font-weight: 900; }
      .screeninfo { font-size: 11px; opacity: 0.5; max-width: 600px; text-align: center; }

      /* ---- Menus: home (what you will drive + a menu of tiles) and its sub-menus ---- */
      .home-bar h1 { margin-right: 4px; }
      button.small.icon { font-size: 20px; padding: 4px 10px; line-height: 1; }
      .menu-bar { justify-content: flex-start; max-width: 980px; }
      .menu-bar h2 { margin-right: auto; }
      .menu-bar .coins { margin-left: 0; }
      button.small.back { padding: 8px 12px; }
      .hero { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr 0.8fr; gap: 12px; }
      button.pick-card {
        border: 2px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 10px 12px; color: #fff; text-align: left;
        background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
        display: flex; flex-direction: column; gap: 2px; font: 13px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
      }
      button.pick-card.daily-on { border-color: #ffd23f; }
      .pk-label { font-size: 11px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; opacity: 0.65; }
      canvas.pk-thumb { width: 100%; height: 96px; border-radius: 12px; display: block; margin: 2px 0 4px; }
      canvas.pk-thumb.vehicle, canvas.detail-thumb { background: radial-gradient(ellipse at 50% 90%, rgba(255,255,255,0.2), rgba(255,255,255,0) 70%); }
      .pk-name { font-size: 19px; font-weight: 900; }
      .pk-detail { font-size: 13px; opacity: 0.8; }
      .pk-change { font-size: 13px; font-weight: 800; color: #8cc4ff; margin-top: 2px; }
      .go-col { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; }
      button.big.huge { font-size: 32px; padding: 22px 10px; border-radius: 18px; flex: 1; max-height: 150px; }
      .go-who { text-align: center; font-size: 13px; font-weight: 700; opacity: 0.8; }
      .tiles { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
      button.tile {
        border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 8px 10px; color: #fff; text-align: left;
        background: rgba(255,255,255,0.08); display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 0 8px; align-items: center;
        font: 13px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
      }
      button.tile .ticon { grid-row: 1 / 3; font-size: 22px; }
      button.tile .tname { font-weight: 800; font-size: 14px; }
      button.tile .tsub { font-size: 11px; opacity: 0.7; }
      button.tile.gold { border-color: rgba(255, 210, 63, 0.6); background: rgba(255, 210, 63, 0.12); }
      button.tile.test { border-color: rgba(229, 56, 59, 0.6); background: rgba(229, 56, 59, 0.12); }
      button.tile:disabled { opacity: 0.45; }
      button.tile.puzzle { border-color: rgba(180, 76, 255, 0.6); background: rgba(180, 76, 255, 0.14); }
      /* Klurbanor */
      .puzzles { width: 100%; max-width: 980px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
      button.pzcard { border: 2px solid rgba(180, 76, 255, 0.35); border-radius: 16px; padding: 8px; color: #fff; text-align: left; background: rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 3px; font: 13px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; }
      button.pzcard canvas { width: 100%; height: 90px; border-radius: 10px; display: block; }
      button.pzcard .pz-name { font-size: 16px; font-weight: 800; }
      button.pzcard .pz-name b { color: #d9a2ff; margin-right: 4px; }
      button.pzcard .pz-name .tick { color: #3fbf5f; }
      button.pzcard .pz-hint { opacity: 0.8; }
      button.pzcard .pz-times { font-size: 12px; color: #d9a2ff; }
      button.pzcard.done { border-color: rgba(63, 191, 95, 0.6); }
      button.pzcard.locked { opacity: 0.55; }
      button.pzcard.locked canvas { filter: grayscale(0.8) brightness(0.7); }
      @media (max-height: 500px) { button.pzcard canvas { height: 60px; } }
      .hint { width: 100%; max-width: 900px; font-size: 13px; opacity: 0.75; text-align: center; }
      /* Garaget: vehicles on the left, the chosen one's upgrades and parts on the right. */
      .split { width: 100%; max-width: 980px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; align-items: start; }
      .split .choices { max-width: none; }
      .detail { display: flex; flex-direction: column; gap: 10px; background: rgba(255,255,255,0.05); border-radius: 16px; padding: 10px; }
      .detail .label { margin-bottom: -4px; }
      .detail-head { display: flex; gap: 10px; align-items: center; }
      canvas.detail-thumb { width: 150px; height: 70px; border-radius: 12px; flex: none; }
      .cards.two { grid-template-columns: repeat(2, 1fr); max-width: none; }
      .card .lvl { margin-left: auto; font-size: 12px; opacity: 0.7; font-weight: 800; }
      /* Upgrade levels: driven (green; orange for the galna levels 11-15), bought but not driven
         (outlined), a gap before level 11; and a stepper to drive at a lower level. */
      .pips i.owned { background: transparent; box-shadow: inset 0 0 0 1.5px #3fbf5f; }
      .pips i.wild.on { background: #ff8a2a; }
      .pips i.gap { margin-left: 4px; }
      .card.wild { border-color: rgba(255, 138, 42, 0.55); }
      button.buy.wild:not(:disabled) { background: linear-gradient(180deg, #ffa24c, #e5671a); box-shadow: 0 3px 0 #9a3f0c; }
      .card .use { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; }
      .card .use b { min-width: 20px; text-align: center; font-size: 14px; }
      .card .use button { width: 26px; height: 24px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.16); color: #fff; font: 800 16px ui-rounded, system-ui, sans-serif; line-height: 1; padding: 0; }
      .card .use button:disabled { opacity: 0.3; }
      button.part.on { border-color: #3fbf5f; background: rgba(63, 191, 95, 0.18); }
      @media (max-aspect-ratio: 4/3) { .split { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr 1fr; } .go-col { grid-column: 1 / -1; } button.big.huge { padding: 14px; } }
      /* Dagens utmaning */
      canvas.daily-track { width: 100%; max-width: 900px; height: 90px; border-radius: 14px; display: block; }
      .daily-events { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .devent { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 2px solid transparent; }
      .devent.on { border-color: #ffd23f; }
      .devent canvas { width: 110px; height: 56px; margin: 0; flex: none; }
      .dtext { display: flex; flex-direction: column; gap: 2px; flex: 1; font-size: 13px; }
      .dtext b { font-size: 16px; }
      .dtext .note { color: #ffd23f; font-weight: 800; font-size: 12px; }
      .devent button.big { padding: 12px 20px; }
      /* Confirm a purchase */
      .confirm { position: fixed; inset: 0; z-index: 30; background: rgba(5, 8, 16, 0.6); display: grid; place-items: center; padding: 16px; }
      .confirm-box {
        background: linear-gradient(170deg, #22304d, #2a2148); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 18px 22px;
        max-width: 420px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        animation: whoPop 0.25s ease-out;
      }
      .confirm-box p { margin: 0; opacity: 0.85; font-size: 14px; }
      .confirm-price { font-size: 34px; font-weight: 900; color: #ffd23f; text-shadow: 0 2px 0 #7a5200; }
      .confirm-box .confirm-left { font-size: 12px; opacity: 0.7; }
      .confirm-box .actions { justify-content: space-between; margin-top: 8px; }
      .confirm-box button.big { flex: 1; padding: 12px 10px; }
      .confirm-box button.big:disabled { opacity: 0.5; }
      .sandbox-note { color: #ffb4a8; font-weight: 800; font-size: 14px; }
      /* Trimning */
      #tune { gap: 10px; }
      #tune .menu-bar h2 .badge { font-size: 10px; }
      /* The bar (Back, Provkör) stays at the top while the sliders scroll. */
      #tune .menu-bar { position: sticky; top: calc(-1 * max(16px, var(--safe-top))); z-index: 3; max-width: 980px; padding: 8px 0; background: rgba(22, 30, 54, 0.96); border-radius: 0 0 14px 14px; }
      @media (max-height: 500px) { button.part small { display: none; } .detail-head .pk-detail { display: none; } }
      .tpick { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 8px; }
      .tveh-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
      .tveh-row button.tveh { min-width: 92px; font-size: 13px; padding: 4px 8px; flex: none; }
      .tveh-row button.tveh canvas { width: 76px; height: 34px; }
      .trow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .trow .label { width: auto; margin: 0; min-width: 34px; }
      .trow .seg { justify-content: flex-start; }
      .ttabs { align-self: center; }
      .ttabs button { padding: 9px 18px; font-size: 14px; }
      .tbody { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 10px; }
      .tsec { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 10px 12px; }
      .tsec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .tsec-head h3 { margin: 0; font-size: 15px; }
      .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 18px; }
      .tslider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 14px; padding: 4px 6px; border-radius: 10px; }
      .tslider .tl { font-weight: 800; display: flex; align-items: center; gap: 6px; }
      .tslider .tl svg { width: 20px; height: 20px; }
      .tslider output { font-weight: 800; font-variant-numeric: tabular-nums; color: #8cc4ff; }
      .tslider input[type=range] { grid-column: 1 / -1; width: 100%; }
      .tslider small { grid-column: 1 / -1; font-size: 12px; opacity: 0.7; line-height: 1.3; }
      .tslider small .from { color: #ffb36b; opacity: 1; }
      .tslider.changed { background: rgba(255, 150, 60, 0.12); }
      .tslider.changed output { color: #ffb36b; }
      .tslider.up output { color: #7dff8a; }
      .tstatus { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
      .pill { padding: 5px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; background: rgba(63, 191, 95, 0.2); color: #9ff0ae; }
      .pill.custom { background: rgba(255, 150, 60, 0.22); color: #ffc48a; }
      .pill.all { background: rgba(140, 196, 255, 0.2); color: #b8dcff; }
      #tune textarea { width: 100%; max-width: 980px; height: 140px; font: 11px ui-monospace, monospace; }
      @media (max-height: 500px) {
        .hero { gap: 8px; }
        canvas.pk-thumb { height: 64px; }
        .pk-name { font-size: 16px; }
        .pk-detail, .pk-change { font-size: 12px; }
        button.pick-card { padding: 6px 10px; }
        button.big.huge { font-size: 26px; padding: 12px 8px; }
        .tiles { gap: 6px; }
        button.tile { padding: 5px 8px; }
        button.tile .ticon { font-size: 18px; }
        button.tile .tname { font-size: 13px; }
        canvas.detail-thumb { width: 110px; height: 50px; }
        .detail { padding: 8px; gap: 6px; }
        canvas.daily-track { height: 60px; }
        .devent canvas { width: 80px; height: 40px; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="game2" class="hidden"></canvas>
    <button id="pauseBtn" class="hidden" aria-label="Paus">❚❚</button>
    <button id="restart" class="hidden" aria-label="Börja om">↻</button>
    <button id="duelLayout" class="hidden"></button>
    <button id="endRun" class="hidden">Avsluta</button>
    <button id="horn" class="hidden" aria-label="Tuta">TUT</button>
    <button id="boost" class="hidden" aria-label="Raketer">BOOST</button>
    <div id="paused" class="screen hidden"><h2>Paus</h2><div class="actions"><button class="big blue" data-act="end">Avsluta åket</button><button class="big" data-act="resume">Fortsätt</button></div><button class="small duel-only" data-act="layout"></button></div>
    <div id="replayBar" class="hidden"><span></span><button class="small" data-act="back">Tillbaka</button></div>
    <button id="update" class="hidden">Ny version finns · tryck för att uppdatera</button>
    <div id="garage" class="screen hidden"></div>
    <div id="results" class="screen hidden"></div>
    <div id="scores" class="screen hidden"></div>
    <div id="tune" class="screen hidden"></div>
    <div id="settings" class="screen hidden"></div>
    <div id="rotate">Vrid enheten till liggande läge</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
