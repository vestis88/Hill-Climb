<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Safari tints its top bar with this; match the sky so the top edge blends in. -->
    <meta name="theme-color" content="#7fb6e6" />
    <title>Ridgeline</title>
    <style>
      /* iPad can report a screen height that stops short of the home bar, leaving a strip of
         page background visible. A solid ground colour (never white) makes any such strip blend
         in with the ground, and the canvas also extends down behind the home bar. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html { margin: 0; height: 100%; overflow: hidden; background-color: #6b4a2f; }
      body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      body {
        position: fixed; inset: 0;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        font: 14px -apple-system, system-ui, sans-serif; color: #fff;
      }
      canvas {
        display: block; position: fixed; z-index: 0;
        top: 0; left: 0;
        width: 100%; height: calc(100% + var(--safe-bottom));
      }
      #endRun {
        position: fixed; z-index: 5;
        top: max(12px, var(--safe-top)); right: max(12px, var(--safe-right));
        padding: 10px 16px; border: 0; border-radius: 12px;
        background: rgba(16, 21, 28, 0.35); color: #fff; font: 600 15px -apple-system, system-ui, sans-serif;
      }
      .hidden { display: none !important; }
      .screen {
        position: fixed; inset: 0; z-index: 6; overflow-y: auto;
        padding: max(16px, var(--safe-top)) max(16px, var(--safe-right)) max(16px, var(--safe-bottom)) max(16px, var(--safe-left));
        box-sizing: border-box; background: rgba(20, 30, 46, 0.86);
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        touch-action: manipulation;
      }
      .screen h1 { margin: 0; font-size: 26px; }
      .screen h2 { margin: 0; font-size: 22px; }
      .bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .coins { font-size: 22px; font-weight: 800; color: #ffd23f; }
      .cards { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .card { background: rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
      .card .name { font-weight: 800; font-size: 16px; }
      .card .blurb { font-size: 12px; opacity: 0.8; min-height: 30px; }
      .pips { display: flex; gap: 3px; }
      .pips i { flex: 1; height: 8px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); }
      .pips i.on { background: #3fbf5f; }
      button.buy, button.big, button.small {
        border: 0; border-radius: 12px; font: 700 15px -apple-system, system-ui, sans-serif; color: #fff;
        padding: 10px 12px; background: #2f80ed;
      }
      button.buy:disabled { background: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.5); }
      button.big { font-size: 22px; padding: 14px 40px; background: #3fbf5f; }
      button.small { font-size: 13px; padding: 8px 12px; background: rgba(255, 255, 255, 0.15); }
      .rows { width: 100%; max-width: 360px; font-size: 16px; }
      .rows div { display: flex; justify-content: space-between; padding: 3px 0; }
      .rows .total { border-top: 1px solid rgba(255, 255, 255, 0.3); margin-top: 4px; padding-top: 6px; font-weight: 800; color: #ffd23f; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .best { font-size: 14px; opacity: 0.85; }
      .label { width: 100%; max-width: 900px; font-size: 13px; font-weight: 700; opacity: 0.75; margin-bottom: -6px; }
      .choices { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      button.choice {
        border: 2px solid transparent; border-radius: 14px; padding: 8px 10px; text-align: left; color: #fff;
        background: rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 2px;
        font: 13px -apple-system, system-ui, sans-serif;
      }
      button.choice .name { font-weight: 800; font-size: 15px; }
      button.choice .blurb { opacity: 0.8; font-size: 12px; }
      button.choice .price { color: #ffd23f; font-weight: 800; }
      button.choice.on { border-color: #3fbf5f; background: rgba(63, 191, 95, 0.18); }
      button.choice.locked { background: rgba(0, 0, 0, 0.25); }
      button.choice:disabled { opacity: 0.55; }
      .coin { color: #ffd23f; }
      .newbest { color: #3fbf5f; font-weight: 800; }
      #tune { gap: 8px; align-items: stretch; }
      #tune .sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 16px; width: 100%; }
      #tune label { display: grid; grid-template-columns: 1fr 60px; gap: 2px 8px; font-size: 13px; }
      #tune input[type=range] { grid-column: 1 / -1; width: 100%; }
      #tune textarea { width: 100%; height: 120px; font: 11px ui-monospace, monospace; }
      .seg { display: inline-flex; border-radius: 10px; overflow: hidden; }
      .seg button { border: 0; padding: 8px 12px; font: 700 13px -apple-system, system-ui, sans-serif; background: rgba(255, 255, 255, 0.12); color: #fff; }
      .seg button.on { background: #2f80ed; }
      @media (max-height: 420px) {
        .screen { gap: 8px; }
        .card { padding: 8px; gap: 4px; }
        .card .blurb { min-height: 0; }
        button.big { font-size: 18px; padding: 10px 32px; }
      }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #1b2330; align-items: center; justify-content: center;
        font-size: 20px; text-align: center; padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="endRun" class="hidden">End run</button>
    <div id="garage" class="screen hidden"></div>
    <div id="results" class="screen hidden"></div>
    <div id="tune" class="screen hidden"></div>
    <div id="rotate">Rotate your device to landscape</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
